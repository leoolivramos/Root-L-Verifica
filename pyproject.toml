[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reliability-lab"
version = "0.1.0"
description = "Sistema pessoal de análise de confiabilidade informacional (PoC local)."
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "instructor>=1.7",
    "openai>=1.50",
    "ddgs>=9",
    "tldextract>=5",
    "pandas>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reliability"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"tests/*" = ["E501", "B011"]
